<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munkaidő-nyilvántartó Kitöltő</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 900px; }
        h2 { color: #333; margin-bottom: 20px; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .preview-container { margin-top: 30px; overflow-x: auto; border: 1px solid #ddd; padding: 10px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #f8f9fa; }
        td[contenteditable="true"] { background-color: #fffbe6; cursor: text; }
        td[contenteditable="true"]:focus { outline: 2px solid #007bff; background-color: #fff; }
        .loading { display: none; color: #007bff; font-weight: bold; }
        .alert { margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Munkaidő XLS Kitöltő</h2>

    <div class="mb-3">
        <label for="fileInput" class="form-label">1. XLS/XLSX Fájl feltöltése</label>
        <input type="file" class="form-control" id="fileInput" accept=".xlsx, .xls">
    </div>

    <div class="mb-3">
        <label class="form-label">2. Munka jellege</label>
        <div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="jobType" id="halfTime" value="half">
                <label class="form-check-label" for="halfTime">Félállás (12:00)</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="jobType" id="fullTime" value="full" checked>
                <label class="form-check-label" for="fullTime">Teljes állás (16:00)</label>
            </div>
        </div>
    </div>

    <div class="mb-3">
        <label for="monthSelect" class="form-label">3. Hónap kiválasztása (Munkalap)</label>
        <select class="form-select" id="monthSelect">
            <option value="2026.01.">2026.01.</option>
            <option value="2026.02.">2026.02.</option>
            <option value="2026.03.">2026.03.</option>
            <option value="2026.04.">2026.04.</option>
            <option value="2026.05.">2026.05.</option>
            <option value="2026.06.">2026.06.</option>
            <option value="2026.07.">2026.07.</option>
            <option value="2026.08.">2026.08.</option>
            <option value="2026.09.">2026.09.</option>
            <option value="2026.10.">2026.10.</option>
            <option value="2026.11.">2026.11.</option>
            <option value="2026.12.">2026.12.</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="vacationDays" class="form-label">4. Szabadságos napok (opcionális)</label>
        <input type="text" class="form-control" id="vacationDays" placeholder="YYYY.MM.DD formátum, vesszővel elválasztva több nap esetén">
        <div class="form-text">Ha több nap van, vesszővel válaszd el őket. Pl: 2026.01.12, 2026.01.13</div>
        <div class="form-text text-danger" id="dateWarning" style="display: none;"></div>
    </div>

    <button class="btn btn-primary w-100" onclick="processFile()">Előnézet Generálása</button>
    <div id="loading" class="loading mt-2">Feldolgozás...</div>
    
    <div id="alertContainer"></div>

    <div class="preview-container" id="previewSection">
        <h3>Előnézet</h3>
        <p class="text-muted">Kattints a sárgás cellákba az értékek módosításához. A "Letöltés" gomb a táblázat jelenlegi állapotát menti el.</p>
        <div id="tableContainer"></div>
        <button class="btn btn-success w-100 mt-3" onclick="downloadFile()">Letöltés</button>
    </div>
</div>

<script>
    let workbook = null;
    let selectedWorksheet = null;
    let modifiedRowsData = [];

    // Dátum validálás
    function validateDateFormat(dateStr) {
        const pattern = /^\d{4}\.\d{2}\.\d{2}$/;
        if (!pattern.test(dateStr)) {
            return false;
        }
        
        const parts = dateStr.split('.');
        const year = parseInt(parts[0]);
        const month = parseInt(parts[1]);
        const day = parseInt(parts[2]);
        
        if (month < 1 || month > 12) return false;
        if (day < 1 || day > 31) return false;
        if (year < 2020 || year > 2030) return false;
        
        return true;
    }

    // Dátum normalizálás (Excel dátum vagy Date objektum -> YYYY.MM.DD string)
    function normalizeDateToString(val) {
        if (!val) return null;
        
        // Ha már string és jó formátumú
        if (typeof val === 'string') {
            const cleaned = val.trim();
            if (/^\d{4}\.\d{2}\.\d{2}/.test(cleaned)) {
                return cleaned.substring(0, 10); // Első 10 karakter: YYYY.MM.DD
            }
        }
        
        // Ha Date objektum
        if (val instanceof Date) {
            const year = val.getFullYear();
            const month = String(val.getMonth() + 1).padStart(2, '0');
            const day = String(val.getDate()).padStart(2, '0');
            return `${year}.${month}.${day}`;
        }
        
        // Ha Excel serial number (1900-01-01-től számított napok)
        if (typeof val === 'number' && val > 0) {
            const excelEpoch = new Date(1899, 11, 30);
            const jsDate = new Date(excelEpoch.getTime() + val * 86400000);
            const year = jsDate.getFullYear();
            const month = String(jsDate.getMonth() + 1).padStart(2, '0');
            const day = String(jsDate.getDate()).padStart(2, '0');
            return `${year}.${month}.${day}`;
        }
        
        return null;
    }

    // Cella színének ellenőrzése
    function hasCellBackground(cell) {
        if (!cell.fill) return false;
        
        // Pattern típusú kitöltés esetén
        if (cell.fill.type === 'pattern') {
            // Ellenőrizzük az előtérszínt
            if (cell.fill.fgColor) {
                const fg = cell.fill.fgColor;
                // Ha van argb vagy theme, akkor színezett
                if (fg.argb || (fg.theme !== undefined && fg.theme !== null)) {
                    return true;
                }
            }
            // Ellenőrizzük a háttérszínt
            if (cell.fill.bgColor) {
                const bg = cell.fill.bgColor;
                if (bg.argb || (bg.theme !== undefined && bg.theme !== null)) {
                    return true;
                }
            }
        }
        
        // Gradient típusú kitöltés
        if (cell.fill.type === 'gradient') {
            return true;
        }
        
        return false;
    }

    // Input figyelés a dátum mezőn
    document.getElementById('vacationDays').addEventListener('input', function(e) {
        const warning = document.getElementById('dateWarning');
        const value = e.target.value.trim();
        
        if (!value) {
            warning.style.display = 'none';
            return;
        }
        
        const dates = value.split(',').map(d => d.trim()).filter(d => d.length > 0);
        const invalidDates = dates.filter(d => !validateDateFormat(d));
        
        if (invalidDates.length > 0) {
            warning.textContent = `⚠️ Hibás formátum: ${invalidDates.join(', ')} - Használd: YYYY.MM.DD`;
            warning.style.display = 'block';
        } else {
            warning.style.display = 'none';
        }
    });

    function showAlert(message, type = 'danger') {
        const container = document.getElementById('alertContainer');
        container.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show mt-3" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
    }

    // Hónapok sorkorlátjai
    const monthRowLimits = {
        '2026.01.': { start: 7, end: 37 },
        '2026.02.': { start: 7, end: 34 },
        '2026.03.': { start: 7, end: 37 },
        '2026.04.': { start: 7, end: 36 },
        '2026.05.': { start: 7, end: 37 },
        '2026.06.': { start: 7, end: 36 },
        '2026.07.': { start: 7, end: 37 },
        '2026.08.': { start: 7, end: 37 },
        '2026.09.': { start: 7, end: 36 },
        '2026.10.': { start: 7, end: 37 },
        '2026.11.': { start: 7, end: 36 },
        '2026.12.': { start: 7, end: 37 }
    };

    // Ellenőrzi, hogy a cella üres-e (nincs benne szöveges tartalom)
    function isCellEmpty(cell) {
        const value = cell.value;
        if (value === null || value === undefined) return true;
        if (typeof value === 'string' && value.trim() === '') return true;
        return false;
    }

    async function processFile() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        const loading = document.getElementById('loading');
        
        if (!file) {
            showAlert("Kérlek válassz ki egy fájlt!");
            return;
        }

        // Szabadság napok validálása
        const vacationInput = document.getElementById('vacationDays').value.trim();
        let vacationDays = [];
        
        if (vacationInput) {
            const inputDates = vacationInput.split(',').map(d => d.trim()).filter(d => d.length > 0);
            const invalidDates = inputDates.filter(d => !validateDateFormat(d));
            
            if (invalidDates.length > 0) {
                showAlert(`❌ Hibás dátumformátum: ${invalidDates.join(', ')}<br>Használd a YYYY.MM.DD formátumot (pl: 2026.01.12)`);
                return;
            }
            vacationDays = inputDates;
        }

        loading.style.display = 'block';
        document.getElementById('alertContainer').innerHTML = '';

        try {
            const arrayBuffer = await file.arrayBuffer();
            
            workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(arrayBuffer);

            const selectedMonth = document.getElementById('monthSelect').value;
            const jobType = document.querySelector('input[name="jobType"]:checked').value;

            // Munkalap keresése
            selectedWorksheet = workbook.getWorksheet(selectedMonth) || 
                               workbook.getWorksheet(selectedMonth.replace(/\.$/, ''));

            if (!selectedWorksheet) {
                showAlert(`Nem található a "${selectedMonth}" nevű munkalap az Excelben!`);
                loading.style.display = 'none';
                return;
            }

            // Sorkorlátok beállítása
            const limits = monthRowLimits[selectedMonth];
            if (!limits) {
                showAlert(`Nem található sorkorlát a "${selectedMonth}" hónaphoz!`, "warning");
                loading.style.display = 'none';
                return;
            }

            // Táblázat adatainak gyűjtése
            modifiedRowsData = [];
            let processedCount = 0;
            let skippedCount = 0;
            
            selectedWorksheet.eachRow({ includeEmpty: true }, function(row, rowNumber) {
                // Sorkorlát ellenőrzése
                if (rowNumber < limits.start || rowNumber > limits.end) return;

                const cellC = row.getCell(3); // C oszlop (Érkezés)
                const cellE = row.getCell(5); // E oszlop (Távozás)
                
                // Ellenőrizzük, hogy üres-e mindkét cella
                if (!isCellEmpty(cellC) || !isCellEmpty(cellE)) {
                    skippedCount++;
                    return; // Már van tartalom, kihagyjuk
                }
                
                // Háttérszín ellenőrzése
                const hasColor = hasCellBackground(cellC);

                // Dátum ellenőrzése az A és B oszlopban
                const cellA_Value = row.getCell(1).value;
                const cellB_Value = row.getCell(2).value;
                
                const dateA = normalizeDateToString(cellA_Value);
                const dateB = normalizeDateToString(cellB_Value);
                
                let isVacation = false;
                if (vacationDays.length > 0) {
                    isVacation = vacationDays.some(vDay => 
                        (dateA && dateA.startsWith(vDay)) || 
                        (dateB && dateB.startsWith(vDay))
                    );
                }

                // Logika végrehajtása
                let valC = cellC.value;
                let valE = cellE.value;

                if (!hasColor) {
                    // Munkanap (nincs színezve)
                    if (isVacation) {
                        valC = "SZ";
                        valE = "SZ";
                    } else {
                        // Normál munkanap
                        valC = "8:00";
                        valE = jobType === 'full' ? "16:00" : "12:00";
                    }
                    
                    processedCount++;
                    
                    // Adatok tárolása
                    modifiedRowsData.push({
                        rowNumber: rowNumber,
                        colC: valC,
                        colE: valE,
                        dateLabel: dateA || dateB || `Sor ${rowNumber}`
                    });
                }
            });

            if (processedCount === 0) {
                showAlert("Nem találtam feldolgozható munkanapo(ka)t a kiválasztott munkalapon.", "warning");
            } else {
                let message = `✅ ${processedCount} munkanap feldolgozva${vacationDays.length > 0 ? `, ${vacationDays.length} szabadság figyelembevételével` : ''}.`;
                if (skippedCount > 0) {
                    message += `<br>ℹ️ ${skippedCount} sor kihagyva (már tartalmaztak adatot).`;
                }
                showAlert(message, "success");
            }

            renderPreviewTable();
            document.getElementById('previewSection').style.display = 'block';

        } catch (error) {
            console.error(error);
            showAlert("Hiba történt a fájl feldolgozása közben: " + error.message);
        } finally {
            loading.style.display = 'none';
        }
    }

    function renderPreviewTable() {
        const container = document.getElementById('tableContainer');
        let html = '<table class="table table-bordered table-striped">';
        html += '<thead><tr><th>Sor</th><th>Dátum</th><th>Érkezés (C oszlop)</th><th>Távozás (E oszlop)</th></tr></thead><tbody>';

        modifiedRowsData.forEach((data, index) => {
            html += `<tr>
                <td>${data.rowNumber}</td>
                <td>${data.dateLabel}</td>
                <td contenteditable="true" id="c-val-${index}">${data.colC}</td>
                <td contenteditable="true" id="e-val-${index}">${data.colE}</td>
            </tr>`;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    async function downloadFile() {
        if (!workbook || !selectedWorksheet) return;

        // Frissítjük a workbook adatait az előnézeti táblázat alapján
        modifiedRowsData.forEach((data, index) => {
            const htmlValC = document.getElementById(`c-val-${index}`).innerText;
            const htmlValE = document.getElementById(`e-val-${index}`).innerText;

            const row = selectedWorksheet.getRow(data.rowNumber);
            const cellC = row.getCell(3);
            const cellE = row.getCell(5);

            cellC.value = htmlValC;
            cellE.value = htmlValE;

            // Stílus megtartása és font beállítása
            cellC.font = { ...(cellC.font || {}), name: 'Times New Roman', size: 13 };
            cellE.font = { ...(cellE.font || {}), name: 'Times New Roman', size: 13 };
        });

        // Mentés
        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        
        const originalName = document.getElementById('fileInput').files[0].name;
        const newName = originalName.replace(/(\.[\w\d_-]+)$/i, '_kitoltve$1');
        
        saveAs(blob, newName);
        showAlert(`✅ Fájl sikeresen letöltve: ${newName}`, "success");
    }
</script>

</body>
</html>
